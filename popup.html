<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube PiP Pro</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="heading">
      <h1>YouTube PiP Pro</h1>
      <p id="status">Checking video...</p>
    </div>
    <button id="lock" class="icon" title="Lock extension controls" aria-label="Lock extension controls">🔓</button>
  </header>

  <label class="language-label" for="language" id="languageLabel">Language / Bahasa</label>
  <select id="language" aria-label="Bahasa / Language">
    <option value="id">🇮🇩 Bahasa Indonesia</option>
    <option value="en">🇬🇧 English</option>
  </select>

  <button id="pip" class="primary">Open / Close PiP</button>

  <section>
    <h2 id="playbackHeading">Playback</h2>
    <div class="controls">
      <button id="previous" title="Previous video" aria-label="Previous video">⏮</button>
      <button id="back" title="Back 10 seconds">−10s</button>
      <button id="play">Play / Pause</button>
      <button id="forward" title="Forward 10 seconds">+10s</button>
      <button id="next" title="Next video" aria-label="Next video">⏭</button>
    </div>
  </section>

  <section>
    <h2 id="speedHeading">Playback speed</h2>
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </section>


  <footer id="footer">Next/previous controls depend on YouTube playlist availability.</footer>
  <p id="error" role="status" aria-live="polite"></p>
</body>
</html>
